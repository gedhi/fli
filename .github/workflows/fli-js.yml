name: fli-js

on:
  push:
    branches: [ main ]
    paths:
      - 'fli-js/**'
      - 'data/**'
      - '.github/workflows/fli-js.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'fli-js/**'
      - 'data/**'
      - '.github/workflows/fli-js.yml'
  workflow_dispatch:
  workflow_call:

defaults:
  run:
    working-directory: fli-js

jobs:
  lint:
    name: Format & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome format check
        run: bun run format:check

      - name: Biome + oxlint check
        run: bun run lint

      - name: TypeScript typecheck
        run: bun run typecheck

  test:
    name: Bun tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify generated enums are in sync with data/
        run: |
          bun run generate:enums
          if ! git diff --quiet src/models/airport.ts src/models/airline.ts; then
            echo "Generated enums are out of date — run 'bun run generate:enums' and commit." >&2
            git diff --stat src/models/airport.ts src/models/airline.ts
            exit 1
          fi

      - name: Run tests
        run: bun test tests/models tests/core tests/search tests/integration
